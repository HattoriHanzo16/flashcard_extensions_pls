name: TypeScript Express CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x]

    steps:
      - uses: actions/checkout@v4
      
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
      
      - name: Install system dependencies for MongoDB Memory Server
        run: |
          wget http://archive.ubuntu.com/ubuntu/pool/main/o/openssl/libssl1.1_1.1.1f-1ubuntu2_amd64.deb
          sudo dpkg -i libssl1.1_1.1.1f-1ubuntu2_amd64.deb
      
      - name: Check if package.json exists
        id: check_package
        run: |
          if [ -f "package.json" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
      
      - name: Install dependencies
        if: steps.check_package.outputs.exists == 'true'
        run: npm install
      
      - name: Check for lint script
        if: steps.check_package.outputs.exists == 'true'
        id: check_lint
        run: |
          if grep -q '"lint"' package.json; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
      
      - name: Lint
        if: steps.check_lint.outputs.exists == 'true'
        run: npm run lint
      
      - name: Check for build script
        if: steps.check_package.outputs.exists == 'true'
        id: check_build
        run: |
          if grep -q '"build"' package.json; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
        
      - name: Build
        if: steps.check_build.outputs.exists == 'true'
        run: npm run build
      
      - name: Check for test script
        if: steps.check_package.outputs.exists == 'true'
        id: check_test
        run: |
          if grep -q '"test"' package.json; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
      
      - name: Test
        if: steps.check_test.outputs.exists == 'true'
        run: npm test 
